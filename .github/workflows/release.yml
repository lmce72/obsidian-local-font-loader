name: release

# Release flow: creating a version tag triggers a GitHub Release
# and attaches cryptographic build-provenance attestations to the assets.
on:
  push:
    tags:
      - '*'

permissions:
  contents: write      # Create the release and upload assets
  id-token: write      # Request an OIDC token for signing
  attestations: write  # Attach build-provenance attestations

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build main.js from src/ so the published artifact always corresponds to the tagged
      # source, whether or not the committed bundle was refreshed before tagging.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build plugin
        run: bun run build

      # Build the release body from this tag's section in CHANGELOG.md, so a published
      # release always carries the fix list for that exact version. Writes a placeholder
      # rather than failing when the version has no section.
      - name: Extract release notes
        run: node .github/extract-release-notes.js

      # Create the GitHub Release and upload the plugin assets.
      # The tag already exists (it triggered this workflow).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            main.js
            manifest.json
            styles.css

      # Sign the release assets with build-provenance attestations so users
      # can cryptographically verify they were built from this repository:
      #   gh attestation verify main.js --repo lmce72/obsidian-local-font-loader
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
